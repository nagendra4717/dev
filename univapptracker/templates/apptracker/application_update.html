<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Application Tracker</title>

    <!-- Bootstrap CSS from a CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
<h1>Welcome to College Application Tracker</h1>

    <!-- Bootstrap JavaScript from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% if user.is_authenticated %}
    <h4 font="bold" color="blue">Signed In As {{ user.username }}!</h4>
        <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
       <a href="{% url 'application_search' %}" class="btn btn-primary me-2">Search Application</a>
       <a href="{% url 'application_list' %}" class="btn btn-primary me-2">My Applications</a>
      <button type="submit" class="btn btn-outline-danger">Log out</button>
    </form>
{% else %}
    <p>Track your college applications in one place. </p>
    <a href="{% url 'account_login' %}">Log in</a>
    |
    <a href="{% url 'account_signup' %}">Sign up</a>
{% endif %}

    <div class="container mt-5">
        <h1 >Update College Application</h1>
<form method="POST" action="{% url 'application_update' application.pk %}">
  {% csrf_token %}
 <div class="row mb-3">
    <label for="college_name" class="sm:col-2 col-form-label">College Name</label>
    <div class="sm:col-10">
      <input type="text" class="form-control" name="college_name"  value="{{ application.college_name }}" id="college_name">
    </div>
  </div>
  <div class="row mb-3">
    <label for="program_name" class="sm:col-2 col-form-label">Program Name</label>
    <div class="sm:col-10">
      <input type="text" class="form-control" name="program_name" value="{{ application.program_name }}" id="program_name">
    </div>
  </div>

  <div class="row mb-3">
<label for="application_type">Choose application type</label>
    <div class="sm:col-10">
<select id="application_type" name="application_type">
  <option value="Regular Decision" {% if application.application_type == "Regular Decision" %}selected{% endif %} >Regular Decision</option>
  <option value="Early Decision" {% if application.application_type == "Early Decision" %}selected{% endif %}>Early Decision</option>
  <option value="Early Action" {% if application.application_type == "Early Action" %}selected{% endif %}>Early Action</option>
</select>
    </div>
  </div>

  <div class="row mb-3">
<label for="application_status">Choose application status</label>
    <div class="sm:col-10">
<select id="application_status" name="application_status">
  <option value="Submitted" {% if application.application_status == "Submitted" %}selected{% endif %}>Submitted</option>
  <option value="Under Review" {% if application.application_status == "Under Review" %}selected{% endif %}>Under Review</option>
  <option value="Accepted" {% if application.application_status == "Accepted" %}selected{% endif %}>Accepted</option>
  <option value="Rejected" {% if application.application_status == "Rejected" %}selected{% endif %}>Rejected</option>
</select>
    </div>
  </div>

<div class="row mb-3">
    <label for="application_fee"  class="sm:col-2 col-form-label">Application Fee</label>
    <div class="sm:col-10">
      <input type="text" class="form-control" name="application_fee"  id="application_fee" value="{{ application.application_fee }}">
    </div>
  </div>

    <div class="row mb-3">
    <label for="application_deadline" class="form-label">Application Deadline</label>
    <div class="sm:col-10">
     <input type="date"  name="application_deadline" class="form-control" id="application_deadline" value="{{ application.application_deadline|date:'Y-m-d' }}" autocomplete="off" placeholder="Choose date…">
    </div>
  

<div class="row mb-3">
    <label for="test_score_needed" class="sm:col-2 col-form-label">Test Score Needed</label>
    <div class="sm:col-10">
  <label>
    <input type="radio" name="test_score_needed" value="yes" {% if application.test_score_needed == "yes" %}checked{% endif %}> Yes
  </label>
  <label>
    <input type="radio" name="test_score_needed" value="no" {% if application.test_score_needed == "no" %}checked{% endif %}> No
  </label>
    </div>
  </div>

<div class="row mb-3">
    <label for="cv_needed" class="sm:col-2 col-form-label">Resume / curriculum vitae Needed</label>
    <div class="sm:col-10">
  <label>
    <input type="radio" name="cv_needed" id="cv_needed_yes" value="yes" {% if application.cv_needed == "yes" %}checked{% endif %}> Yes
  </label>
  <label>
    <input type="radio" name="cv_needed" id="cv_needed_no" value="no" {% if application.cv_needed == "no" %}checked{% endif %}> No
  </label>
    </div>
  </div>

  <div class="row mb-3">
    <label for="transcripts_needed" class="sm:col-2 col-form-label">Transcripts Needed</label>
    <div class="sm:col-10">
  <label>
    <input type="radio" name="transcripts_needed" id="transcripts_needed_yes" value="yes" {% if application.transcripts_needed == "yes" %}checked{% endif %}> Yes
  </label>
  <label>
    <input type="radio" name="transcripts_needed" id="transcripts_needed_no" value="no" {% if application.transcripts_needed == "no" %}checked{% endif %}> No
  </label>
    </div>
  </div>

<div class="row mb-3">
    <label for="personal_statement_needed" class="sm:col-2 col-form-label">Personal Statement Needed</label>
    <div class="sm:col-10">
  <label>
    <input type="radio" name="personal_statement_needed" value="yes" {% if application.personal_statement_needed == "yes" %}checked{% endif %}> Yes
  </label>
  <label>
    <input type="radio" name="personal_statement_needed" value="no" {% if application.personal_statement_needed == "no" %}checked{% endif %}> No
  </label>
    </div>
  </div>


  <div class="row mb-3">
<label for="reco_letters_needed">Recommendation Letters Needed</label>
    <div class="sm:col-10">
<select id="reco_letters_needed" name="reco_letters_needed">
  <option value="0" selected>0</option>
  <option value="1" {% if application.reco_letters_needed == "1" %}selected{% endif %}>1</option>
  <option value="2" {% if application.reco_letters_needed == "2" %}selected{% endif %}>2</option>
  <option value="3" {% if application.reco_letters_needed == "3" %}selected{% endif %}>3</option>
  <option value="4" {% if application.reco_letters_needed == "4" %}selected{% endif %}>4</option>
  <option value="5" {% if application.reco_letters_needed == "5" %}selected{% endif %}>5</option>
</select>
    </div>
  </div>
<div>
  <button type="submit" class="btn-solid theme-primary">Update Tracker Record</button>
      </div>
</form>

</body>
</html>
