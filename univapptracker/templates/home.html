
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>
  :root {
    --bs-body-font-family: "Geist", system-ui, sans-serif;
    --bs-font-mono: "Geist Mono", ui-monospace, monospace;
  }
</style>
    <!-- Bootstrap CSS from a CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
<title>College Application Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <div class="container d-flex flex-column justify-content-center align-items-center text-center"
         style="min-height: 100vh;">
<h1>Welcome to College Application Tracker</h1>

{% if user.is_authenticated %}
    <h4 font="bold" color="blue">Hello, {{ user.username }}! You are signed in.</h4>
    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
       <a href="{% url 'application_create' %}" class="btn btn-primary me-2">New Application</a>
       <a href="{% url 'application_search' %}" class="btn btn-primary me-2">Search Application</a>
  

      <button type="submit" class="btn btn-outline-danger">Log out</button>
    </form>
{% else %}
    <h4>Track your college applications in one place. </h4>
    <a href="{% url 'account_login' %}">Log in</a>
    |
    <a href="{% url 'account_signup' %}">Sign up</a>
{% endif %}
<script type="importmap">
{
  "imports": {
    "@floating-ui/dom": "https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.7.6/dist/floating-ui.dom.esm.min.js",
    "vanilla-calendar-pro": "https://cdn.jsdelivr.net/npm/vanilla-calendar-pro@3.4.0/index.mjs"
  }
}
</script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

 </div>
</body>

</html>
